<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
    <defs>
        <linearGradient id="editorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#44A08D;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <g id="icon">
        <!-- Document -->
        <path d="M12 6 L12 42 L36 42 L36 16 L26 6 Z" 
              fill="url(#editorGradient)" stroke="#3A9A8F" stroke-width="1.5"/>
        
        <!-- Folded corner -->
        <path d="M26 6 L26 16 L36 16 Z" 
              fill="#5DD9D1" opacity="0.6"/>
        
        <!-- Text lines -->
        <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9">
            <line x1="16" y1="22" x2="32" y2="22"/>
            <line x1="16" y1="27" x2="30" y2="27"/>
            <line x1="16" y1="32" x2="32" y2="32"/>
            <line x1="16" y1="37" x2="28" y2="37"/>
        </g>
        
        <!-- Pencil icon overlay -->
        <g transform="translate(28, 28)">
            <rect x="0" y="8" width="3" height="10" rx="1" 
                  fill="#FFD93D" transform="rotate(-45 1.5 13)"/>
            <polygon points="2,6 4,8 1,11" fill="#FFA500"/>
        </g>
    </g>
</svg>
