<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
    <defs>
        <linearGradient id="termGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1A252F;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <g id="icon">
        <!-- Terminal window -->
        <rect x="6" y="10" width="36" height="28" rx="3" 
              fill="url(#termGradient)" stroke="#34495E" stroke-width="1.5"/>
        
        <!-- Title bar -->
        <rect x="6" y="10" width="36" height="6" rx="3" 
              fill="#34495E"/>
        
        <!-- Window controls -->
        <circle cx="11" cy="13" r="1.5" fill="#FF5F56"/>
        <circle cx="16" cy="13" r="1.5" fill="#FFBD2E"/>
        <circle cx="21" cy="13" r="1.5" fill="#27C93F"/>
        
        <!-- Prompt symbol (>) -->
        <path d="M12 22 L18 26 L12 30" 
              fill="none" stroke="#00FF00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Cursor line -->
        <rect x="22" y="24" width="12" height="2" rx="1" fill="#00FF00" opacity="0.8"/>
        
        <!-- Additional terminal lines -->
        <rect x="12" y="32" width="20" height="1.5" rx="0.5" fill="#00FF00" opacity="0.5"/>
    </g>
</svg>
