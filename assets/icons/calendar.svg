<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
    <defs>
        <linearGradient id="calGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#EE5A6F;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <g id="icon">
        <!-- Calendar body -->
        <rect x="8" y="12" width="32" height="28" rx="3" 
              fill="url(#calGradient)" stroke="#CC4455" stroke-width="1.5"/>
        
        <!-- Calendar header -->
        <rect x="8" y="12" width="32" height="8" rx="3" 
              fill="#FF8888"/>
        
        <!-- Binding rings -->
        <circle cx="16" cy="10" r="2" fill="#FFFFFF"/>
        <circle cx="32" cy="10" r="2" fill="#FFFFFF"/>
        
        <!-- Date grid -->
        <g fill="#FFFFFF" opacity="0.9">
            <!-- Week 1 -->
            <rect x="12" y="24" width="4" height="3" rx="1"/>
            <rect x="18" y="24" width="4" height="3" rx="1"/>
            <rect x="24" y="24" width="4" height="3" rx="1"/>
            <rect x="30" y="24" width="4" height="3" rx="1"/>
            
            <!-- Week 2 -->
            <rect x="12" y="29" width="4" height="3" rx="1"/>
            <rect x="18" y="29" width="4" height="3" rx="1"/>
            <rect x="24" y="29" width="4" height="3" rx="1"/>
            <rect x="30" y="29" width="4" height="3" rx="1"/>
            
            <!-- Week 3 -->
            <rect x="12" y="34" width="4" height="3" rx="1"/>
            <rect x="18" y="34" width="4" height="3" rx="1"/>
            <rect x="24" y="34" width="4" height="3" rx="1" fill="#FFD93D"/>
            <rect x="30" y="34" width="4" height="3" rx="1"/>
        </g>
    </g>
</svg>
