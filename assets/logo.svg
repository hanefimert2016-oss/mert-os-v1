<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <g id="logo">
        <!-- Outer circle -->
        <circle cx="75" cy="75" r="65" fill="url(#logoGradient)" opacity="0.2"/>
        
        <!-- Main circle -->
        <circle cx="75" cy="75" r="55" fill="url(#logoGradient)" filter="url(#glow)"/>
        
        <!-- Letter M design -->
        <g fill="#FFFFFF">
            <!-- Left vertical -->
            <rect x="45" y="45" width="8" height="60" rx="4"/>
            
            <!-- Right vertical -->
            <rect x="97" y="45" width="8" height="60" rx="4"/>
            
            <!-- Left diagonal -->
            <rect x="53" y="45" width="8" height="40" rx="4" transform="rotate(35 57 65)"/>
            
            <!-- Right diagonal -->
            <rect x="89" y="45" width="8" height="40" rx="4" transform="rotate(-35 93 65)"/>
            
            <!-- Center vertical (short) -->
            <rect x="71" y="65" width="8" height="25" rx="4"/>
        </g>
        
        <!-- Decorative circles -->
        <circle cx="75" cy="30" r="5" fill="#FFFFFF" opacity="0.8"/>
        <circle cx="110" cy="75" r="4" fill="#FFFFFF" opacity="0.6"/>
        <circle cx="40" cy="75" r="4" fill="#FFFFFF" opacity="0.6"/>
        <circle cx="95" cy="110" r="3" fill="#FFFFFF" opacity="0.5"/>
        <circle cx="55" cy="110" r="3" fill="#FFFFFF" opacity="0.5"/>
        
        <!-- Orbit lines -->
        <circle cx="75" cy="75" r="68" fill="none" stroke="#87CEEB" stroke-width="1" opacity="0.3"/>
        <circle cx="75" cy="75" r="72" fill="none" stroke="#87CEEB" stroke-width="0.5" opacity="0.2"/>
    </g>
</svg>
